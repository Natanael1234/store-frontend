@if(error) {
<p>{{ error }}</p>
}

<mat-form-field class="search" [classList]="['text-query-field']">
  <mat-label>Clearable input</mat-label>
  <input matInput type="text" [(ngModel)]="textQuery" />
  @if (textQuery) {
  <button matSuffix mat-icon-button aria-label="Clear" (click)="textQuery = ''">
    <mat-icon>close</mat-icon>
  </button>
  }
</mat-form-field>

<table
  mat-table
  [dataSource]="dataSource"
  matSort
  (matSortChange)="onSortEvent($event)"
>
  <!--- Note that these columns can be defined in any order.
  The actual rendered columns are set as a property on the row definition" -->

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header class="name">Nome</th>
    <td mat-cell *matCellDef="let user" class="name">
      @if (loading) {
      <div>
        <div class="skeleton-loader"></div>
      </div>
      } @else {
      {{ user.name }} }
    </td>
  </ng-container>

  <!-- Email Column -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>E-mail</th>
    <td mat-cell *matCellDef="let user">
      @if (loading) {
      <div>
        <div class="skeleton-loader"></div>
      </div>
      } @else {
      {{ user.email }}
      }
    </td>
  </ng-container>

  <!-- Active Column -->
  <ng-container matColumnDef="active">
    <th mat-header-cell *matHeaderCellDef mat-sort-header class="shrink">
      Ativo
    </th>
    <td mat-cell *matCellDef="let user" class="shrink">
      @if (loading) {
      <div class="skeleton-loader"></div>
      } @else if(user.active){
      <mat-icon aria-label="Ícone ativo">check</mat-icon>
      }
    </td>
  </ng-container>

  <!-- Deletion Column -->
  <ng-container matColumnDef="deleted">
    <th mat-header-cell *matHeaderCellDef mat-sort-header class="shrink">
      Deletado
    </th>
    <td mat-cell *matCellDef="let user" class="shrink">
      @if (loading) {
      <div class="skeleton-loader"></div>
      } @else if(user.deleted){
      <mat-icon aria-label="Ícone deletado">check</mat-icon>
      }
    </td>
  </ng-container>

  <!-- Headers -->

  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>

  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator
  (page)="onPageEvent($event)"
  [pageSizeOptions]="pageSizeOptions"
  [length]="lenght"
  [pageSize]="pageSize"
  showFirstLastButtons
  aria-label="Selecione a página"
>
</mat-paginator>
