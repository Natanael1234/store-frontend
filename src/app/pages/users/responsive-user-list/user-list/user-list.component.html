<mat-list>
    @for (user of users(); track user; let last = $last) {
        <app-user-item
            [name]="user.name"
            [email]="user.email"
            [active]="!!user.active"
            [deleted]="!!user.deleted"
            [loading]="!!loading()"
            (click)="onItemClick($event, user)"></app-user-item>

        @if (!last) {
            <mat-divider></mat-divider>
        }
    }
</mat-list>
