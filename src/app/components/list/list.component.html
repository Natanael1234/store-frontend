<mat-list>
    @for (item of data(); track item; let last = $last) {
        <!-- TODO: item and icons disabled  -->
        <app-list-item
            [labels]="item.labels"
            [icons]="item.icons"
            [loading]="!!loading()"
            (click)="onItemClick($event, item.id!)"></app-list-item>

        @if (!last) {
            <mat-divider></mat-divider>
        }
    }
</mat-list>
