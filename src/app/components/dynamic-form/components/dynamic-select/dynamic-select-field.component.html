<mat-form-field appearance="outline">
    @if (select?.label != null && select?.label != undefined) {
        <mat-label>{{ select?.label }}</mat-label>
    }
    <mat-select [id]="select?.id || ''" [formControl]="select?.control!">
        @for (option of select?.options || []; track $index) {
            <mat-option [value]="option.value">
                {{ option.label }}
            </mat-option>
        }
    </mat-select>
</mat-form-field>
